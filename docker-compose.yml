services:
  postgres:
    container_name: bugfarmer-postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 5s
      timeout: 5s
      retries: 5

  builder:
    container_name: bugfarmer-builder
    build:
      context: ./nakama/modules
      dockerfile: Dockerfile.build
    volumes:
      - modules:/output

  nakama:
    container_name: bugfarmer-nakama
    image: registry.heroiclabs.com/heroiclabs/nakama:3.35.0
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdev@postgres:5432/nakama &&
        exec /nakama/nakama --config /nakama/data/local.yml --database.address postgres:localdev@postgres:5432/nakama
    restart: unless-stopped
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    depends_on:
      postgres:
        condition: service_healthy
      builder:
        condition: service_completed_successfully
    volumes:
      - ./nakama/data:/nakama/data
      - modules:/nakama/data/modules:ro
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  modules:
