name: bugfarmer

logger:
  level: INFO
  stdout: true

session:
  token_expiry_sec: 7200

socket:
  max_message_size_bytes: 8388608   # 8MB
  max_request_size_bytes: 8388608   # 8MB
  read_buffer_size_bytes: 1048576   # 1MB
  write_buffer_size_bytes: 1048576  # 1MB
  outgoing_queue_size: 1024         # default 64 — too small for our per-tick
                                    # reliable EntityUpdate/SwarmUpdate broadcasts;
                                    # a brief client hitch overflowed it and the
                                    # server closed the session ("outgoing queue full")

runtime:
  js_entrypoint: ""
  lua_entrypoint: ""
  path: /nakama/data/modules
