<!doctype html>
<html><head><meta charset="utf-8"><title>BugFarmer Art Lab</title>
<style>
 body{font-family:system-ui,sans-serif;background:#222;color:#eee;margin:0;display:flex}
 #side{width:360px;padding:14px;box-sizing:border-box;height:100vh;overflow:auto;background:#2b2b2b}
 #main{flex:1;display:flex;align-items:flex-start;justify-content:center;background:#333;overflow:auto;height:100vh;padding:12px}
 canvas{image-rendering:pixelated;background:#3a3a3a}
 .row{margin:8px 0;padding:8px 10px;background:#333;border-radius:6px}
 .lab{font-size:12px;color:#ffe08a;margin-top:5px;word-break:break-all}
 h2{margin:.2em 0;font-size:18px} h3{margin:.7em 0 .2em;font-size:14px;color:#9cf}
 select,button{font-size:13px;margin:2px} button{cursor:pointer}
 #apply{font-size:15px;padding:7px 14px;background:#2e7d32;color:#fff;border:0;border-radius:6px;margin-top:6px}
 #apply:disabled{background:#555} #status{font-size:12px;color:#9f9;margin-left:8px}
 #picks{margin-top:10px;padding:8px;background:#1d1d1d;border-radius:6px}
</style></head>
<body>
<div id="side">
 <h2>🎨 Art Lab</h2>
 <label>Scene <select id="scene"></select></label>
 <label style="display:block;margin-top:6px">Zoom <input type="range" id="zoom" min="0.25" max="6" step="0.25" value="1"> <span id="zlab">1x</span></label>
 <h3>Variants in this scene</h3>
 <div id="controls"></div>
 <button id="apply">✔ Apply — set as live + re-render</button><span id="status"></span>
 <div id="picks"><b>Current selection</b><div id="pickslist"></div></div>
</div>
<div id="main"><canvas id="cv"></canvas></div>
<script>
let S=null, CUR=null, ver=0;
const sel={}, imgs={};
const $=id=>document.getElementById(id);
const J=async u=>(await fetch(u)).json();

function img(url){ if(!imgs[url]){const i=new Image(); i.onload=draw; i.src=url; imgs[url]=i;} return imgs[url]; }
function variants(k){ return S.variants[k]||[]; }
function curFile(k){ const v=variants(k); return v.length?v[sel[k]]:null; }
function sceneUrl(){ return '/scene/'+CUR.file+'?v='+ver; }
function varUrl(k){ const f=curFile(k); return f?('/variant/'+k+'/'+f):null; }

function initSel(){
 for(const k in S.variants){
  const v=S.variants[k]; const saved=S.selection[k];
  sel[k] = saved && v.indexOf(saved)>=0 ? v.indexOf(saved) : 0;
 }
}
function buildSceneSelect(){
 const ss=$('scene'); ss.innerHTML='';
 for(const zone in S.zones){
  const og=document.createElement('optgroup'); og.label=zone;
  for(const n of S.zones[zone]){ const o=document.createElement('option'); o.value=n; o.text=n; og.appendChild(o); }
  ss.appendChild(og);
 }
 ss.onchange=()=>selectScene(ss.value);
}
async function selectScene(name){
 $('status').textContent='rendering…';
 CUR=await J('/api/scene/'+name);
 for(const k of CUR.keys) for(const f of variants(k)) img('/variant/'+k+'/'+f);
 img(sceneUrl());
 buildControls(); draw(); $('status').textContent='';
}
function buildControls(){
 const c=$('controls'); c.innerHTML='';
 if(!CUR.keys.length){ c.textContent='(no variant-backed art in this scene)'; }
 for(const k of CUR.keys){
  const row=document.createElement('div'); row.className='row';
  row.innerHTML='<b>'+k+'</b>  <button class="vm">&lt;</button> <span class="vn"></span> '+
                '<button class="vp">&gt;</button><div class="lab"></div>';
  c.appendChild(row);
  row.querySelector('.vm').onclick=()=>step(k,-1,row);
  row.querySelector('.vp').onclick=()=>step(k,1,row);
  upd(k,row);
 }
 refreshPicks();
}
function step(k,d,row){ const n=variants(k).length; if(!n)return; sel[k]=(sel[k]+d+n)%n; upd(k,row); draw(); }
function upd(k,row){ const v=variants(k);
 row.querySelector('.vn').textContent=(v.length?sel[k]+1:0)+'/'+v.length;
 row.querySelector('.lab').textContent=curFile(k)||'(none)'; refreshPicks(); }
function refreshPicks(){ const d=$('pickslist'); d.innerHTML='';
 for(const k of (CUR?CUR.keys:[])){ const e=document.createElement('div'); e.className='lab';
  e.textContent=k+'  →  '+(curFile(k)||'(none)'); d.appendChild(e); } }

function applyZoom(){ const z=+$('zoom').value, cv=$('cv');
 cv.style.width=(CUR.w*z)+'px'; cv.style.height=(CUR.h*z)+'px'; $('zlab').textContent=z+'x'; }
$('zoom').oninput=applyZoom;

function draw(){
 if(!CUR) return;
 const cv=$('cv'); cv.width=CUR.w; cv.height=CUR.h;
 const ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false; ctx.clearRect(0,0,CUR.w,CUR.h);
 const bg=img(sceneUrl()); if(bg.complete&&bg.naturalWidth) ctx.drawImage(bg,0,0,CUR.w,CUR.h);
 for(const d of CUR.draw){ const u=varUrl(d.key); if(!u) continue;        // single BACK-TO-FRONT pass
  const im=imgs[u]; if(!im||!im.complete||!im.naturalWidth) continue;
  ctx.drawImage(im,d.x,d.y,d.w,d.h); }
 applyZoom();
}

async function apply(){
 const selection={}; for(const k in sel){ const f=curFile(k); if(f) selection[k]=f; }
 $('apply').disabled=true; $('status').textContent='applying…';
 try{
  const j=await (await fetch('/api/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({selection})})).json();
  ver=Date.now();                                          // previews re-rendered -> bust scene image
  CUR=await J('/api/scene/'+CUR.name); img(sceneUrl());
  $('status').textContent='✔ applied: '+(j.applied.join(', ')||'(none)');
 }catch(e){ $('status').textContent='✖ '+e; }
 $('apply').disabled=false; setTimeout(draw,300);
}
$('apply').onclick=apply;

async function boot(){
 S=await J('/api/state'); initSel(); buildSceneSelect();
 const first=Object.values(S.zones)[0][0]; $('scene').value=first; selectScene(first);
}
boot();
</script></body></html>
